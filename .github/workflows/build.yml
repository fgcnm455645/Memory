name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find or unzip project
        run: |
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$f" ]; then
            z=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -1)
            echo "Zip: $z"
            if [ -z "$z" ]; then echo "No project and no zip found"; ls -R | head -50; exit 1; fi
            mkdir -p proj
            unzip -q -o "$z" -d proj
            f=$(find proj -name settings.gradle.kts | head -1)
          fi
          echo "Found: $f"
          echo "DIR=$(dirname "$f")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MemoryTest-debug-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
